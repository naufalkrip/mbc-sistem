<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistem Manajemen Organisasi MB CHONDRO" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>MB CHONDRO — Sistem Manajemen Organisasi</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('mbc_view_mode');
          if (mode === 'desktop') {
            var screenWidth = window.screen.width || window.innerWidth || 390;
            var scale = Math.max(0.25, Math.min(1.0, +(screenWidth / 1180).toFixed(2)));
            var meta = document.querySelector('meta[name="viewport"]');
            if (meta) {
              meta.content = 'width=1180, initial-scale=' + scale + ', maximum-scale=3.0, user-scalable=yes';
            }
            document.documentElement.classList.add('desktop-mode-active');
          }
        } catch (e) {}

        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect != location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
